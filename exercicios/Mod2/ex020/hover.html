<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            color: red;
        }

        div > p {
            display: none;
            background-color: yellow;
            color: red;
        }

        div:hover > p {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>

    <div>
        Clique aqui para ver a surpresa
        <p>Surpresaaaa!</p>
    </div>

    <p>Fim do exemplo</p>
</body>
</html>
