<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em html5</title>
</head>
<body>
    <h1>Midias em html5</h1>
    
    <h2>Imagens dinamicas</h2>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem grande">
    </picture>

    <h2>Audio em html5</h2>
    <audio preload="metadata" controls autoplay loop>
        <source src="midia/i-dont-know-why.mp3" type="audio/mpeg">
        <source src="midia/i-dont-know-why.ogg" type="audio/ogg">
        <source src="midia/i-dont-know-why.wav" type="image/wav">
    </audio>
</body>
</html>
